<div class="mb-5">
  <h5 class="text-primary mb-4">
    <i class="bi bi-list-task me-2"></i>Funcions del Càrrec
  </h5>

  <div id="funcions-container" class="mb-3">
    <!-- S'omple amb JavaScript -->
  </div>

  <div class="card border-dashed">
    <div class="card-body">
      <div class="row mb-3">
          <div class="col">
              <input type="text" id="nova-funcio" class="form-control" placeholder="Descripció de la funció (Ex: Desenvolupar aplicacions web amb React)">
          </div>
          <div class="col-auto">
              <button class="tercer-btn" type="button" onclick="FuncionsManager.afegirFuncio()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                  </svg>
              </button>
          </div>
      </div>

      <small class="text-muted mt-2 d-block">Escriu la funció i prem Enter o fes clic a "+" per afegir-la.</small>
      <div id="error-funcions" class="error-validacio form-text text-danger"></div>
    </div>
  </div>
</div>
